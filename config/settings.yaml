# MarketPulse configuration — single source of truth for tunable values.
# Nothing in src/ should hardcode a value that belongs here.

scraper:
  hashtags:
    - nifty50
    - sensex
    - intraday
    - banknifty
  # x.com's own search UI now redirects unauthenticated requests to a login wall (verified
  # 2026-08-04), so collection targets Nitter — an open-source, login-free HTML front-end
  # that surfaces the same public X.com content. No official/paid API, no tweepy, no auth.
  # Nitter instances are unofficial and go up/down often, hence the failover list.
  search_path_template: "https://{host}/search?f=tweets&q=%23{hashtag}"
  nitter_hosts:
    - "nitter.tiekoetter.com"
    - "xcancel.com"
    - "nitter.net"
  hours_lookback: 24
  min_tweets_target: 2000
  headless: true
  worker_pool_size: 4          # ProcessPoolExecutor workers, one hashtag per worker
  pagination:
    min_pause_seconds: 1.5
    max_pause_seconds: 4.5
    max_pages_per_session: 400
    # How long to wait for search results to render before treating the host as
    # unhealthy. 10s was too tight under concurrent scraping: 4 hashtags hitting the
    # same first-listed host at once causes real server-side contention, and the
    # slowest of the four would occasionally miss a 10s window and trigger an
    # unnecessary host failover — a self-inflicted false positive, not a bad host.
    page_render_timeout_seconds: 20
  rate_limiter:
    bucket_capacity: 20        # token bucket size
    refill_rate_per_second: 0.5
    backoff_base_seconds: 5
    backoff_max_seconds: 300
    backoff_multiplier: 2.0
  anti_detection:
    rotate_user_agent_every_n_actions: 15
    soft_block_indicators:
      - "Instance has been rate limited"
      - "Make sure you have cookies enabled"
      - "Verifying your browser"
      - "antibot"
      - "Error 429"

storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  rejects_dir: "data/processed/_rejects"
  output_dir: "data/output"
  signals_dir: "data/output/signals"
  plots_dir: "data/output/plots"
  chunk_size_rows: 50000
  parquet_compression: "snappy"
  target_part_file_mb: 96

processing:
  near_duplicate_hash_fields:
    - text_normalized
    - username

analysis:
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    min_df: 2
    stopwords_extra:           # merged with sklearn's English stopwords
      - "rt"
      - "amp"
      - "via"
  bucket_minutes: 15
  bootstrap:
    n_resamples: 500
    confidence_level: 0.90
  signal_weights:
    sentiment: 0.4
    virality: 0.35
    hashtag_momentum: 0.25
  # Terms are matched with word-boundary regex against tweet text. Two design rules,
  # found necessary by spot-checking real scraped tweets (see docs/approach.md):
  # 1. Avoid single words that are commonly used neutrally/descriptively in trading
  #    chatter (e.g. bare "resistance"/"support" just labeling a chart level, not making
  #    a directional call) — prefer more specific multi-word phrases instead.
  # 2. Avoid terms that are substrings of an opposite-polarity phrase (e.g. bare "short"
  #    inside bullish "short covering"), which double-counts and cancels out a clear signal.
  sentiment_lexicon:
    bullish:
      - "breakout"
      - "buy"
      - "long buildup"
      - "short covering"
      - "support held"
      - "bullish"
      - "rally"
      - "upside"
      - "target hit"
      - "accumulate"
    bearish:
      - "breakdown"
      - "sell"
      - "short buildup"
      - "rejected at resistance"
      - "bearish"
      - "crash"
      - "correction"
      - "downside"
      - "stop loss hit"
      - "dump"

aggregation:
  rollup_windows:
    - "1H"
    - "1D"

visualization:
  reservoir_sample_size: 5000
  dpi: 120

logging:
  level: "INFO"
  dir: "logs"
