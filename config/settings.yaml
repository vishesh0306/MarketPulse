# MarketPulse configuration — single source of truth for tunable values.
# Nothing in src/ should hardcode a value that belongs here.

scraper:
  # The four hashtags named in the assignment. Always collected.
  hashtags:
    - nifty50
    - sensex
    - intraday
    - banknifty
  # "Similar hashtags" (assignment's wording) for the same Indian-market chatter, collected
  # alongside the core four to reach the 2,000-tweet target given how thin and rate-limited
  # the public Nitter mirrors are. Overlap with the core four is expected and handled by
  # dedup (tweet_id + content hash). #giftnifty in particular trades outside NSE cash hours
  # and helps populate the otherwise near-empty overnight buckets.
  related_hashtags:
    - nifty
    - niftybank
    - giftnifty
    - stockmarket
    - sharemarket
    - nse
  # x.com's own search UI requires a login. Nitter is an open-source, login-free front-end
  # for the same public content, so collection targets it instead. No official/paid API.
  # Nitter instances are unofficial and go up/down often, hence the long failover list —
  # a dead host is detected and skipped, so extra candidates only ever help.
  search_path_template: "https://{host}/search?f=tweets&q=%23{hashtag}"
  nitter_hosts:
    - "xcancel.com"
    - "nitter.poast.org"
    - "nitter.tiekoetter.com"
    - "lightbrd.com"
    - "nitter.privacyredirect.com"
    - "nitter.net"
    - "nitter.space"
  hours_lookback: 24
  min_tweets_target: 2000
  headless: true
  worker_pool_size: 4          # ProcessPoolExecutor workers, one hashtag per worker
  pagination:
    min_pause_seconds: 1.5
    max_pause_seconds: 4.5
    max_pages_per_session: 400
    # How long to wait for search results to render before treating the host as
    # unhealthy. Needs headroom for 4 hashtags hitting the same host concurrently.
    page_render_timeout_seconds: 20
  rate_limiter:
    bucket_capacity: 20        # token bucket size
    refill_rate_per_second: 0.5
    backoff_base_seconds: 5
    backoff_max_seconds: 300
    backoff_multiplier: 2.0
  anti_detection:
    soft_block_indicators:
      - "Instance has been rate limited"
      - "Make sure you have cookies enabled"
      - "Verifying your browser"
      - "not a bot"          # e.g. Anubis's "Making sure you're not a bot!" challenge
      - "antibot"
      - "Error 429"

storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  rejects_dir: "data/processed/_rejects"
  output_dir: "data/output"
  signals_dir: "data/output/signals"
  plots_dir: "data/output/plots"
  chunk_size_rows: 50000
  parquet_compression: "snappy"

processing:
  # source_hashtag included so a tweet legitimately collected under two target hashtags
  # (identical text and author each time) isn't caught by this layer either — see
  # deduplicator.py's docstring for why exact-ID dedup keys on the same pair.
  near_duplicate_hash_fields:
    - text_normalized
    - username
    - source_hashtag

analysis:
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    min_df: 2
    stopwords_extra:           # merged with sklearn's English stopwords
      - "rt"
      - "amp"
      - "via"
  bucket_minutes: 15
  # NSE trades 09:15-15:30 IST, Mon-Fri. Off-hours chatter stays in data/processed, but
  # bucketing it into the trading signal mostly measures conversation volume at 2am, not
  # market sentiment — and those thin off-hours buckets are the ones with the widest,
  # least meaningful confidence intervals.
  filter_market_hours: true
  bootstrap:
    n_resamples: 500
    confidence_level: 0.90
    random_seed: 42
  signal_weights:
    sentiment: 0.4
    virality: 0.35
    hashtag_momentum: 0.25
  # Terms are matched with word-boundary regex against tweet text. Prefer specific
  # multi-word phrases over single words that get used neutrally in trading chatter
  # (e.g. bare "resistance"), and avoid terms that are substrings of an opposite-polarity
  # phrase (e.g. bare "short" inside bullish "short covering").
  sentiment_lexicon:
    bullish:
      - "breakout"
      - "buy"
      - "long buildup"
      - "short covering"
      - "support held"
      - "bullish"
      - "rally"
      - "upside"
      - "target hit"
      - "accumulate"
    bearish:
      - "breakdown"
      - "sell"
      - "short buildup"
      - "rejected at resistance"
      - "bearish"
      - "crash"
      - "correction"
      - "downside"
      - "stop loss hit"
      - "dump"

aggregation:
  # pandas offset aliases — lowercase since pandas 2.2 ('1H'/'1D' are deprecated).
  rollup_windows:
    - "1h"
    - "1d"

visualization:
  reservoir_sample_size: 5000
  dpi: 120

logging:
  level: "INFO"
  dir: "logs"
