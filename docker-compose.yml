# Two ways to run MarketPulse:
#   docker compose run --rm marketpulse      -> the batch pipeline (collect -> ... -> plot)
#   docker compose up realtime               -> the real-time RSS tail + signal API on :8000
# The batch service needs no other container; the realtime service needs redis.

services:
  marketpulse:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      HASHTAGS: ${HASHTAGS:-nifty50,sensex,intraday,banknifty}
      HOURS: ${HOURS:-24}
      MIN_TWEETS: ${MIN_TWEETS:-2000}
      WORKERS: ${WORKERS:-4}
    # No depends_on: the batch pipeline reads all config from config/settings.yaml and
    # runs standalone against local Parquet files.

  realtime:
    build: .
    command: ["python", "-m", "src.realtime", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketpulse}
      POSTGRES_USER: ${POSTGRES_USER:-marketpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  timescale_data:
