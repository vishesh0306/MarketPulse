# Optional: local Postgres/TimescaleDB + Redis for anyone extending storage beyond flat
# Parquet files, matching the target tooling stack (see ARCHITECTURE.md section 6).
# The default pipeline (`make pipeline`) does not require this stack to run.

services:
  marketpulse:
    build: .
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      HASHTAGS: ${HASHTAGS:-nifty50,sensex,intraday,banknifty}
      HOURS: ${HOURS:-24}
      MIN_TWEETS: ${MIN_TWEETS:-2000}
      WORKERS: ${WORKERS:-4}
    # depends_on db/redis is deliberately omitted: the current pipeline reads all config
    # from config/settings.yaml and doesn't connect to Postgres/Redis at all yet (that's
    # documented 10x-scale future work in ARCHITECTURE.md section 6) — this service runs
    # standalone against local Parquet files with no dependency on the other two.

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketpulse}
      POSTGRES_USER: ${POSTGRES_USER:-marketpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  timescale_data:
